name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Build shim package
        run: cd shim && uv build

      - name: Upload shim artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-shim
          path: shim/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/project/dcp-tools
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish

  publish-shim:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI trusted publishing
    environment:
      name: pypi-shim
      url: https://pypi.org/project/bblocks-datacommons-tools
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download shim artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-shim
          path: dist/

      - name: Publish shim to PyPI
        run: uv publish

  github-release:
    needs: [publish, publish-shim]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create a GitHub release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download shim artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-shim
          path: dist-shim/

      - name: Classify the tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: |
            dist/*
            dist-shim/*
