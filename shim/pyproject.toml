[project]
name = "bblocks-datacommons-tools"
version = "0.1.1"
description = "Deprecated: renamed to dcp-tools. Installs dcp-tools and redirects imports."
authors = [
    { name = "ONE Campaign" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dcp-tools>=0.1.1",
]

[tool.uv.build-backend]
module-name = "bblocks.datacommons_tools"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
