[project]
name = "bblocks-datacommons-tools"
version = "1.0.0a3"
description = "Deprecated: renamed to dcp-tools. Installs dcp-tools and redirects imports."
authors = [
    { name = "ONE Campaign" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dcp-tools>=1.0.0a3",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Operating System :: OS Independent",
]

[project.urls]
repository = "https://github.com/ONEcampaign/dcp-tools"
documentation = "https://pypi.org/project/dcp-tools/"
homepage = "https://github.com/ONEcampaign/dcp-tools"
issues = "https://github.com/ONEcampaign/dcp-tools/issues"

[tool.uv.build-backend]
module-name = "bblocks.datacommons_tools"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
